[package]
name = "skilyst-agent"
version = "0.1.0"
edition = "2021"
description = "Skilyst Agent desktop shell (Tauri v2)"

[lib]
name = "skilyst_agent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "skilyst-agent"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
