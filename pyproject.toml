[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skilyst-agent"
version = "0.1.0"
description = "Skilyst Agent runtime: skill-package loader, sandbox, Beehive client, agent loop"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
skilyst = "cli:main"

# The runtime ships as flat top-level modules/packages under src/ (no install step is
# required in development: `PYTHONPATH=src python3 -m cli` or ./bin/skilyst).
[tool.setuptools]
package-dir = { "" = "src" }
packages = ["agent", "beehive", "llm", "manifest", "sandbox", "session", "skills"]
py-modules = ["cli", "config", "errors"]

[tool.unittest]
start-dir = "tests"
